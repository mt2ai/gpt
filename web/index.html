<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Metin2 Wiki GPT</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <!-- Header Minimalista -->
    <header class="app-header">
      <div class="brand">
        <span class="status-dot"></span>
        <h1>Metin2 Oracle</h1>
      </div>
      <div class="header-badges">
        <span class="badge">Oficial DE</span>
        <span class="badge">Cero Alucinaciones</span>
      </div>
    </header>

    <!-- Chat Stream -->
    <main class="chat-container" id="chatContainer">
      <!-- Mensaje de bienvenida -->
      <div class="message assistant">
        <div class="avatar">M2</div>
        <div class="bubble">
          <p><strong>¡Hola!</strong> Soy tu asistente personal de <strong>Metin2</strong>.</p>
          <p>Toda la información se extrae directamente de la wiki oficial alemana (la más actualizada) en tiempo real con sus iconos del juego.</p>
          <div class="chips">
            <button class="chip" onclick="quickAsk('materiales espada bambu +9')">🗡️ Bambú a +9</button>
            <button class="chip" onclick="quickAsk('donde cae el vms')">🌙 Drop de VMS</button>
            <button class="chip" onclick="quickAsk('mision biologo 30 dientes orco')">📜 Biólogo 30</button>
            <button class="chip" onclick="quickAsk('hierro rojo +9')">🪓 Hierro Rojo +9</button>
          </div>
        </div>
      </div>
    </main>

    <!-- Input Bar Estilo ChatGPT Mobile -->
    <footer class="input-container">
      <form id="chatForm" onsubmit="handleSend(event)">
        <div class="input-wrapper">
          <input 
            type="text" 
            id="userInput" 
            placeholder="Pregunta lo que sea (ej: q pide pa nuebe la enve)..." 
            autocomplete="off" 
            autocorrect="off" 
            spellcheck="false"
          >
          <button type="submit" id="sendBtn" aria-label="Enviar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>
      </form>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
